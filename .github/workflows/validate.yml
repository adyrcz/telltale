name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plugin checks (scripts/validate.py)
        run: python3 -I scripts/validate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Official schema checks. Pinned so a new Claude Code release can't change results without a commit here.
      - name: claude plugin validate --strict
        run: |
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate .claude-plugin/plugin.json --strict
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate .claude-plugin/marketplace.json --strict
